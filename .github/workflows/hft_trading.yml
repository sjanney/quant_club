name: HFT Trading (Intraday Scalping)

on:
  schedule:
    # Every 10 minutes during market hours (9:30 AM - 4:00 PM ET)
    # UTC times: 13:30-20:00 UTC = 9:30-16:00 ET (adjust for DST)
    # Using 13:00-20:00 UTC to cover 9:00-16:00 ET (slightly wider window)
    - cron: '*/10 13-20 * * 1-5'  # Every 10 min, 13:00-20:00 UTC, Mon-Fri
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  hft-cycle:
    name: HFT Execution Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hft-trading
      cancel-in-progress: false  # Don't cancel if another run starts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Validate required secrets
        run: |
          missing=0
          for key in ALPACA_API_KEY ALPACA_API_SECRET; do
            val="${!key}"
            if [ -z "$val" ]; then
              echo "::error::Secret $key is missing or empty."
              missing=1
            else
              echo "Secret $key is set (length ${#val} chars)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add ALPACA_API_KEY and ALPACA_API_SECRET in repo Settings → Secrets and variables → Actions."
            echo "::error::If this run is from a fork, secrets are not available; run from the main repo or add secrets to the fork."
            exit 1
          fi

      - name: Run HFT cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_PAPER: "true"
          LOG_LEVEL: INFO
          GITHUB_ACTIONS: "true"
        run: |
          python main.py --mode hft

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hft-logs-${{ github.run_id }}
          path: |
            logs/*.log
            state/daily_*.txt
          retention-days: 30

      - name: Set job summary
        if: always()
        run: |
          echo "## HFT Trading Cycle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/trading_desk.log ]; then
            echo "### Recent Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 logs/trading_desk.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
