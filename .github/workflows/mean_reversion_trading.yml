name: Mean Reversion + Options Trading

on:
  schedule:
    # Run once daily at market open (9:32 AM ET) — EST variant (UTC-5) and EDT (UTC-4)
    - cron: "32 14 * * 1-5"   # 9:32 AM ET (EST, Nov-Mar)
    - cron: "32 13 * * 1-5"   # 9:32 AM ET (EDT, Mar-Nov)
  workflow_dispatch:
    inputs:
      options:
        description: "Enable options overlays"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: mean-reversion-trading
  cancel-in-progress: false

jobs:
  mean-reversion:
    name: Mean Reversion Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-lock.txt

      - name: Validate required secrets
        run: |
          missing=0
          for key in ALPACA_API_KEY ALPACA_API_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

      - name: Run mean reversion strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_PAPER: "true"
          LOG_LEVEL: INFO
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_ACTIONS: "true"
        run: |
          OPTIONS_FLAG=""
          if [ "${{ github.event.inputs.options }}" = "false" ]; then
            OPTIONS_FLAG="--no-options"
          fi
          python main.py --mode mean-reversion $OPTIONS_FLAG

      - name: Set job summary
        if: always()
        run: |
          echo "## Mean Reversion + Options Cycle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Options:** ${{ github.event.inputs.options || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/trading_desk.log ]; then
            echo "### Recent Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 logs/trading_desk.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mean-reversion-logs-${{ github.run_id }}
          path: |
            logs/*.log
            state/daily_*.txt
          retention-days: 30
